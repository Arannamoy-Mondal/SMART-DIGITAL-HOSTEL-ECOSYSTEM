<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Hostel Ecosystem</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center p-4">

    <div id="toastAlert" class="toast toast-top toast-end z-[100] hidden">
        <div class="alert text-white shadow-lg">
            <span id="toastMessage">Message</span>
        </div>
    </div>

    <div class="card w-full max-w-md bg-base-100 shadow-2xl border-t-4 border-primary">
        <div class="card-body text-center">
            
            <div class="mb-6">
                <h2 class="text-3xl font-bold text-primary mb-2">Welcome Back!</h2>
                <p class="text-gray-500">Sign in to your account</p>
            </div>

            <form id="loginForm" class="space-y-4 text-left">
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold">Username</span></label>
                    <input type="text" id="username" class="input input-bordered w-full" placeholder="Enter your username" required />
                </div>
                
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold">Password</span></label>
                    <input type="password" id="password" class="input input-bordered w-full" placeholder="Enter your password" required />
                </div>

                <div class="form-control mt-6">
                    <button type="submit" id="loginBtn" class="btn btn-primary w-full text-lg">Login</button>
                </div>
            </form>

            <div class="divider mt-6">OR</div>
            <p class="text-sm">Don't have an account? <a href="/signup.html" class="text-primary font-bold hover:underline">Sign up</a></p>

        </div>
    </div>

    <script>
        // --- Helper Function: Toast Notification ---
        function showToast(message, type = "success") {
            const toast = document.getElementById('toastAlert');
            const alertBox = toast.querySelector('.alert');
            document.getElementById('toastMessage').textContent = message;
            alertBox.className = `alert text-white shadow-lg ${type === 'success' ? 'alert-success' : 'alert-error'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // --- Login Logic ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            // Button Loading State
            btn.innerHTML = '<span class="loading loading-spinner"></span> Authenticating...';
            btn.disabled = true;

            try {
                // ==================================================
                // STEP 1: Call Login API to get JWT Token
                // ==================================================
                const loginPayload = { 
                    userName: usernameInput, 
                    password: passwordInput 
                };
                
                const loginRes = await fetch("http://localhost:8001/user/login", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(loginPayload)
                });

                if (!loginRes.ok) throw new Error("Invalid username or password!");

                // যেহেতু স্প্রিং বুট সরাসরি স্ট্রিং রিটার্ন করছে, তাই text() ব্যবহার করা হলো
                const token = await loginRes.text(); 
                
                if(!token) throw new Error("Token not found in response.");

                // টোকেন লোকাল স্টোরেজে সেভ করা হলো
                localStorage.setItem("jwtToken", token);


                // ==================================================
                // STEP 2: Fetch User Role & Details using Token
                // ==================================================
                const profileRes = await fetch(`http://localhost:8001/user/get/${usernameInput}`, {
                    method: "GET",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` 
                    }
                });

                if (!profileRes.ok) throw new Error("Failed to fetch user role!");

                const userProfile = await profileRes.json();
                
                // ডাটাগুলো ভেরিয়েবলে নেওয়া
                const loggedInUserName = userProfile.userName;
                const userRole = userProfile.role.role.toLowerCase(); // যেমন: "admin"

                // Username এবং Role লোকাল স্টোরেজে সেভ করা হলো (যাতে অন্যান্য পেজে ব্যবহার করা যায়)
                localStorage.setItem("loggedInUsername", loggedInUserName);
                localStorage.setItem("userRole", userRole);

                showToast("Login Successful! Redirecting...", "success");

                // ==================================================
                // STEP 3: Redirect Based on Role
                // ==================================================
                setTimeout(() => {
                    if (userRole === "admin") {
                        window.location.href = "/admin-home.html"; // অ্যাডমিন পেজে রিডাইরেক্ট
                    } else {
                        window.location.href = "/tenant-home.html"; // টেন্যান্ট পেজে রিডাইরেক্ট
                    }
                }, 1000);

            } catch (error) {
                console.error("Login Error:", error);
                showToast(error.message, "error");
                
                // Error হলে বাটন আগের অবস্থায় ফিরিয়ে আনা
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        });
        const checkAuthorization = () => {
            const token = localStorage.getItem("jwtToken");
            const role = localStorage.getItem("role")
            if (token && role == "tenant") {
                window.location.href = "/tenant-home.html"
            }
            else if (token && role == "admin") {
                window.location.href = "/admin-home.html"
            }
            // else {
            //     window.location.href = "/login.html"
            // }
        }
        window.onload = checkAuthorization;
    </script>
</body>

</html>
