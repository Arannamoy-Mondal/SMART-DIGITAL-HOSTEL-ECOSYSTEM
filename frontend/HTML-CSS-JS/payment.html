<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 flex items-center justify-center min-h-screen">

    <div id="toastAlert" class="toast toast-top toast-end z-[100] hidden">
        <div class="alert alert-info text-white shadow-lg">
            <span id="toastMessage">Message</span>
        </div>
    </div>

    <div class="card w-full max-w-md bg-base-100 shadow-2xl border-t-4 border-primary">
        <div class="card-body text-center">
            
            <div class="mb-4">
                <div class="avatar placeholder mb-2">
                    <div class="bg-primary text-neutral-content rounded-full w-16">
                        <span class="text-2xl">🔒</span>
                    </div>
                </div>
                <h2 class="text-2xl font-bold">Secure Checkout</h2>
                <p class="text-gray-500 text-sm">Complete your room booking payment</p>
            </div>

            <div class="bg-base-200 rounded-lg p-5 text-left mb-6">
                <div class="flex justify-between items-center border-b border-base-300 pb-3 mb-3">
                    <span class="text-gray-500 font-semibold">Total Amount</span>
                    <span id="displayAmount" class="text-3xl font-bold text-green-600">৳ 0.00</span>
                </div>
                
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-500">Billed To:</span>
                        <span id="displayUser" class="font-semibold">Loading...</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Room Details:</span>
                        <span id="displayRoom" class="font-semibold">Loading...</span>
                    </div>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-base-300">
                        <span class="text-gray-500">Payment Method:</span>
                        <span id="displayMethod" class="badge badge-primary uppercase font-bold text-xs p-3">Method</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <button id="btnPay" class="btn btn-primary btn-lg w-full text-white" onclick="processPayment()">
                    Confirm & Pay
                </button>
                <button class="btn btn-ghost w-full" onclick="cancelPayment()">Cancel and return to Dashboard</button>
            </div>

            <p class="text-xs text-gray-400 mt-4 flex items-center justify-center gap-1">
                <span>🔒</span> 256-bit SSL encrypted secure transaction
            </p>

        </div>
    </div>

    <div id="processingOverlay" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex-col items-center justify-center text-white">
        <span class="loading loading-spinner loading-lg text-primary mb-4"></span>
        <h3 class="text-2xl font-bold" id="overlayText">Processing Payment...</h3>
        <p class="text-sm opacity-80 mt-2">Please do not close or refresh this window.</p>
    </div>

    <script>
        // --- Helpers ---
        function showToast(message, type = "success") {
            const toast = document.getElementById('toastAlert');
            const alertBox = toast.querySelector('.alert');
            document.getElementById('toastMessage').textContent = message;
            alertBox.className = `alert text-white shadow-lg ${type === 'success' ? 'alert-success' : 'alert-error'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        const getToken = () => localStorage.getItem("jwtToken");
        const getHeaders = () => ({ "Content-Type": "application/json", "Authorization": `Bearer ${getToken()}` });


        const rawData = localStorage.getItem("pendingBookingInfo");
        let bookingData = null;

        document.addEventListener("DOMContentLoaded", () => {
          
            if (!rawData || !getToken()) {
                window.location.href = "/index.html";
                return;
            }

         
            bookingData = JSON.parse(rawData);
            document.getElementById("displayAmount").textContent = `৳ ${bookingData.amount}`;
            document.getElementById("displayUser").textContent = bookingData.userName;
            document.getElementById("displayRoom").textContent = `Room ${bookingData.roomNo}`;
            document.getElementById("displayMethod").textContent = bookingData.paymentMethod;
        });


        function cancelPayment() {
            localStorage.removeItem("pendingBookingInfo");
            window.location.href = "/index.html";
        }

      
        async function processPayment() {
            const overlay = document.getElementById("processingOverlay");
            const overlayText = document.getElementById("overlayText");
            
            overlay.classList.remove("hidden");
            overlay.classList.add("flex");

            try {
                await new Promise(resolve => setTimeout(resolve, 2000));
                overlayText.textContent = "Verifying Transaction...";

              
                const apiUrl = localStorage.getItem("paymentApiUrl") || "http://localhost:8001/roomBooking/create";
                
             
                const res = await fetch(apiUrl, { 
                    method: "POST", 
                    headers: getHeaders(), 
                   
                    body: JSON.stringify(bookingData) 
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error("❌ Backend Error Message:", errorText);
                    throw new Error(errorText || "Something went wrong! Please try again.");
                }

          
                overlayText.textContent = "Payment Successful!";
                overlayText.classList.add("text-success");
                
                localStorage.removeItem("pendingBookingInfo");
                localStorage.removeItem("paymentApiUrl"); 
                
                setTimeout(() => {
                    const returnUrl = localStorage.getItem("returnTo") || "/index.html";
                    localStorage.removeItem("returnTo");
                    window.location.href = returnUrl; 
                }, 1500);

            } catch (error) {
                overlay.classList.add("hidden");
                overlay.classList.remove("flex");
                showToast(error.message, "error");
            }
        }
       
        // const checkAuthorization = () => {
        //     const token = localStorage.getItem("jwtToken");
        //     const role = localStorage.getItem("userRole")
        //     if (token && role == "tenant") {
        //         window.location.href = "/tenant-home.html"
        //     }
        //     else if (token && role == "admin") {
        //         window.location.href = "/admin-home.html"
        //     }
        //     // else {
        //     //     window.location.href = "/login.html"
        //     // }
        // }
        // window.onload = checkAuthorization;
    </script>
</body>

</html>
